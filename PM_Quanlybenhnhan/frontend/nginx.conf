server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Build assets — tên file có hash nên cache vĩnh viễn được
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # SPA catch-all — tất cả route fallback về index.html cho Vue Router.
    # Fallback phải là URI (không kèm =404) để nginx internal-redirect sang
    # /index.html, nhờ đó location dưới đây mới được áp dụng.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html trỏ tới các asset có hash. Nếu nó bị cache, trình duyệt vẫn
    # nạp bundle cũ sau khi deploy — phải revalidate mỗi lần tải.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
