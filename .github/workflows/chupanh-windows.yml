name: ChupAnh - Manual Windows Build
# Chỉ chạy khi chủ repo bấm Run workflow. Không build khi push source.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ChupAnh
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: ChupAnh/requirements.txt
      - name: Install recorded requirements
        run: python -m pip install -r requirements.txt
      - name: Test on Windows
        run: python -m unittest discover -v
      - name: Compile native EXE (manual request only)
        run: python build_windows.py --skip-install
      - name: Upload build for the requester
        uses: actions/upload-artifact@v4
        with:
          name: ChupAnh-Windows
          path: |
            ChupAnh/dist/ChupAnh-Windows.zip
            ChupAnh/dist/smoke-report.json
          if-no-files-found: error
          retention-days: 14
