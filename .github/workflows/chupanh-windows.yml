name: ChupAnh - Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ChupAnh/**'
      - '.github/workflows/chupanh-windows.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ChupAnh
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            ChupAnh/requirements.txt
            ChupAnh/requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test on Windows
        run: python -m unittest discover -v
      - name: Build EXE and smoke-test packaged app
        run: python build_windows.py --skip-install
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChupAnh-Windows
          path: |
            ChupAnh/dist/ChupAnh-Windows.zip
            ChupAnh/dist/smoke-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseTag = "chupanh-v1.4-${{ github.run_number }}"
          gh release create $releaseTag dist/ChupAnh-Windows.zip --repo "$env:GITHUB_REPOSITORY" --target "${{ github.sha }}" --title "ChupAnh 1.4 - Windows" --notes "Portable Windows build. Extract the complete ZIP and launch ChupAnh.exe. Python installation is not required." --latest=false
