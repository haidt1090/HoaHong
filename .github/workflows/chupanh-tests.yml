name: ChupAnh - Source tests only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ChupAnh/**'
      - '.github/workflows/chupanh-tests.yml'
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ChupAnh
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: ChupAnh/requirements.txt
      - name: Test the actual full installer
        shell: cmd
        run: call CAI_DAT.bat
        env:
          CHUPANH_NONINTERACTIVE: '1'
      - name: Test source without packaging
        run: .\.venv\Scripts\python.exe -m unittest discover -v
