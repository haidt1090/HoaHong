name: KySoPython - Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Kyso/**'
      - '.github/workflows/kyso-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Kyso
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: |
            Kyso/requirements.txt
            Kyso/requirements-build.txt
      - run: python -m pip install --no-input -r requirements-build.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
        env:
          KYSO_GUI_TESTS: '1'
      - name: Verify Tcl/Tk desktop available
        run: python -c "import tkinter as tk; root=tk.Tk(); root.update(); root.destroy()"
      - run: python -m PyInstaller --noconfirm --clean KySoPython.spec
      - uses: actions/upload-artifact@v4
        with:
          name: KySoPython-Windows
          path: Kyso/dist/KySoPython.exe
          if-no-files-found: error
          retention-days: 30
