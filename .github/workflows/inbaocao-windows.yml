name: InBaoCao - Build Windows EXE (Python)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'InBaoCao/**'
      - '.github/workflows/inbaocao-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: InBaoCao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            InBaoCao/requirements.txt
            InBaoCao/requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean InBaoCao.spec
      - uses: actions/upload-artifact@v4
        with:
          name: InBaoCao-Windows-Python
          path: InBaoCao/dist/InBaoCao.exe
          if-no-files-found: error
          retention-days: 30
