name: InBaoCao - Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'InBaoCao/**'
      - '.github/workflows/inbaocao-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: InBaoCao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: InBaoCao/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run pack:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: InBaoCao-Windows-x64
          path: |
            InBaoCao/release/*.exe
            InBaoCao/release/*.blockmap
          if-no-files-found: error
          retention-days: 30
